<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — Customs & Excise Tariff Book</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero hero-single-title">
    <div class="hero-inner">
      <div>
        <h1 class="display">CUSTOMS &amp; EXCISE TARIFF BOOK</h1>
        <p class="hero-subtitle">Choose a new password</p>
      </div>
    </div>
  </header>

  <main class="auth-layout">
    <section class="card auth-card">
      <h2 class="section-title display">Reset password</h2>
      <p id="reset-status" class="auth-muted">Checking your reset link…</p>
      <form id="reset-form" class="auth-form" hidden>
        <input type="password" name="newPassword" placeholder="New password (min 8 characters)" autocomplete="new-password" required />
        <input type="password" name="confirmPassword" placeholder="Confirm new password" autocomplete="new-password" required />
        <button type="submit">Update password</button>
      </form>
      <div class="register-wrapper">
        <a href="login.html" class="auth-switch-link">Back to sign in</a>
      </div>
    </section>
  </main>

  <p id="auth-message" class="auth-message"></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    (function () {
      const statusEl = document.getElementById("reset-status");
      const form = document.getElementById("reset-form");
      const msg = document.getElementById("auth-message");

      function show(text, type) {
        msg.textContent = text;
        msg.className = "auth-message " + type;
      }

      if (!window.supabase || window.SUPABASE_URL.includes("YOUR-PROJECT")) {
        statusEl.textContent = "Password reset is not configured yet.";
        return;
      }

      const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
      let ready = false;

      function enableForm() {
        if (ready) return;
        ready = true;
        statusEl.textContent = "Enter your new password below.";
        form.hidden = false;
      }

      // Supabase reads the recovery token from the link and signs the person in temporarily.
      sb.auth.onAuthStateChange(function (event) {
        if (event === "PASSWORD_RECOVERY") enableForm();
      });

      window.setTimeout(async function () {
        const { data } = await sb.auth.getSession();
        if (data && data.session) enableForm();
        else if (!ready) statusEl.textContent = "This reset link is invalid or has expired. Request a new one from the sign-in page.";
      }, 1500);

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        const pw = form.newPassword.value;
        const confirm = form.confirmPassword.value;

        if (pw.length < 8) return show("Password must be at least 8 characters.", "error");
        if (pw !== confirm) return show("Passwords do not match.", "error");

        const { error } = await sb.auth.updateUser({ password: pw });
        if (error) return show("Could not update the password. The link may have expired.", "error");

        show("Password updated. Redirecting to sign in…", "success");
        await sb.auth.signOut();
        window.setTimeout(function () { window.location.href = "login.html"; }, 1500);
      });
    })();
  </script>
</body>
</html>
